<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<div style="background:#0A0F1C;position:relative;overflow:hidden;padding:48px 20px 40px;text-align:center;font-family:'Inter',sans-serif;">
  <!-- Background grid -->
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(255,214,66,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,214,66,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;"></div>
  <!-- Gold glow -->
  <div style="position:absolute;top:-150px;right:-100px;width:400px;height:400px;background:#FFD642;border-radius:50%;filter:blur(120px);opacity:0.1;pointer-events:none;"></div>
  <!-- Green glow -->
  <div style="position:absolute;bottom:-100px;left:-150px;width:350px;height:350px;background:#37ca37;border-radius:50%;filter:blur(120px);opacity:0.1;pointer-events:none;"></div>

  <div style="position:relative;z-index:2;max-width:700px;margin:0 auto;">
    <!-- Logo -->
    <a href="Smartworker.html" style="text-decoration:none;display:inline-block;margin-bottom:4px;">
      <span style="font-family:'Inter Tight',sans-serif;font-weight:900;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-0.03em;color:#fff;">Smart</span><span style="font-family:'Inter Tight',sans-serif;font-weight:900;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-0.03em;color:#FFD642;">Worker</span>
    </a>
    <div style="font-family:'Inter Tight',sans-serif;font-size:clamp(0.7rem,1.8vw,0.85rem);color:#8893A8;letter-spacing:0.25em;text-transform:uppercase;font-weight:500;margin-bottom:28px;">Обучающая система</div>

    <!-- Badge -->
    <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,214,66,0.1);border:1px solid rgba(255,214,66,0.25);border-radius:50px;padding:8px 18px;font-size:0.8rem;color:#FFD642;font-weight:600;margin-bottom:22px;letter-spacing:0.05em;text-transform:uppercase;">
      <span style="width:8px;height:8px;background:#37ca37;border-radius:50%;display:inline-block;animation:pulse 2s infinite;"></span>
      Набор открыт
    </div>

    <!-- Heading -->
    <h1 style="font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-0.03em;color:#fff;line-height:1.15;margin:0 0 16px;">Узнай, есть&nbsp;ли у&nbsp;тебя навыки для <span style="color:#FFD642;">удалённой работы</span></h1>
    <p style="font-size:clamp(0.95rem,2.5vw,1.15rem);color:#8893A8;max-width:560px;margin:0 auto 28px;line-height:1.65;font-family:'Inter',sans-serif;">Ответь на несколько вопросов, и мы подскажем, какой путь к работе с американскими компаниями подойдёт именно тебе</p>

    <!-- Trust strip -->
    <div style="display:flex;justify-content:center;gap:28px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:8px;font-size:clamp(0.8rem,2vw,0.88rem);color:#8893A8;">
        <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;background:rgba(255,214,66,0.1);border:1px solid rgba(255,214,66,0.2);">&#9201;</div>
        <span>Займёт 2 минуты</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;font-size:clamp(0.8rem,2vw,0.88rem);color:#8893A8;">
        <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;background:rgba(55,202,55,0.1);border:1px solid rgba(55,202,55,0.2);">&#10003;</div>
        <span>60+ трудоустроенных</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;font-size:clamp(0.8rem,2vw,0.88rem);color:#8893A8;">
        <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;background:rgba(24,139,246,0.1);border:1px solid rgba(24,139,246,0.2);">&#128274;</div>
        <span>Данные защищены</span>
      </div>
    </div>
  </div>

  <style>
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  </style>
</div>
