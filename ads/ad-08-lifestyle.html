<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1000px;height:1000px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:#0A0F1C;}
</style>
</head>
<body>
<div style="width:1000px;height:1000px;position:relative;overflow:hidden;">
  <div style="position:absolute;top:100px;left:100px;width:400px;height:400px;background:#FFD642;border-radius:50%;filter:blur(200px);opacity:0.06;"></div>
  <div style="position:absolute;bottom:100px;right:100px;width:400px;height:400px;background:#37ca37;border-radius:50%;filter:blur(200px);opacity:0.06;"></div>
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;background:#189bf6;border-radius:50%;filter:blur(180px);opacity:0.05;"></div>

  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;width:1000px;height:1000px;padding:70px;text-align:center;">
    <div><span style="font-weight:900;font-size:36px;color:#fff;letter-spacing:-0.03em;">Smart</span><span style="font-weight:900;font-size:36px;color:#FFD642;letter-spacing:-0.03em;">Worker</span></div>

    <h1 style="font-weight:900;font-size:60px;color:#fff;letter-spacing:-0.04em;line-height:1.08;margin:24px 0 40px;">Работай откуда<br>хочешь — <span style="background:linear-gradient(135deg,#FFD642,#37ca37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">живи как<br>хочешь</span></h1>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:760px;margin-bottom:36px;">
      <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px 24px;text-align:center;">
        <div style="font-size:48px;margin-bottom:14px;">🏠</div>
        <div style="font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;">Из дома</div>
        <p style="font-size:17px;color:#8893A8;line-height:1.4;">Никаких пробок и дресс-кода</p>
      </div>
      <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px 24px;text-align:center;">
        <div style="font-size:48px;margin-bottom:14px;">🌴</div>
        <div style="font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;">С моря</div>
        <p style="font-size:17px;color:#8893A8;line-height:1.4;">Работай из Бали, Турции, Грузии</p>
      </div>
      <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px 24px;text-align:center;">
        <div style="font-size:48px;margin-bottom:14px;">☕</div>
        <div style="font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;">Из кафе</div>
        <p style="font-size:17px;color:#8893A8;line-height:1.4;">Ноутбук + Wi-Fi = офис</p>
      </div>
      <div style="background:rgba(255,214,66,0.06);border:1px solid rgba(255,214,66,0.2);border-radius:20px;padding:28px 24px;text-align:center;">
        <div style="font-size:48px;margin-bottom:14px;">💵</div>
        <div style="font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;">$1 000–3 000</div>
        <p style="font-size:17px;color:#8893A8;line-height:1.4;">Доход в долларах ежемесячно</p>
      </div>
    </div>

    <p style="font-size:26px;color:#c0c8d8;line-height:1.5;margin-bottom:28px;">SmartWorker научит и <strong style="color:#FFD642;">трудоустроит</strong></p>
    <div style="background:#FFD642;color:#0A0F1C;font-weight:800;font-size:24px;padding:22px 52px;border-radius:14px;box-shadow:0 0 60px rgba(255,214,66,0.25);">Начать путь →</div>
  </div>
</div>
</body>
</html>
