<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1000px;height:1000px;overflow:hidden;font-family:'Inter Tight',sans-serif;background:#0A0F1C;}
</style>
</head>
<body>
<div style="width:1000px;height:1000px;position:relative;overflow:hidden;">
  <!-- Gold frame corners -->
  <div style="position:absolute;inset:16px;border:2px solid rgba(255,214,66,0.2);border-radius:24px;z-index:3;"></div>
  <div style="position:absolute;top:16px;left:16px;width:40px;height:40px;border-top:4px solid #FFD642;border-left:4px solid #FFD642;border-radius:24px 0 0 0;z-index:4;"></div>
  <div style="position:absolute;top:16px;right:16px;width:40px;height:40px;border-top:4px solid #FFD642;border-right:4px solid #FFD642;border-radius:0 24px 0 0;z-index:4;"></div>
  <div style="position:absolute;bottom:16px;left:16px;width:40px;height:40px;border-bottom:4px solid #FFD642;border-left:4px solid #FFD642;border-radius:0 0 0 24px;z-index:4;"></div>
  <div style="position:absolute;bottom:16px;right:16px;width:40px;height:40px;border-bottom:4px solid #FFD642;border-right:4px solid #FFD642;border-radius:0 0 24px 0;z-index:4;"></div>
  <div style="position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:#FFD642;border-radius:50%;filter:blur(180px);opacity:0.08;"></div>

  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;width:1000px;height:1000px;padding:80px 70px;text-align:center;">
    <div><span style="font-weight:900;font-size:36px;color:#fff;letter-spacing:-0.03em;">Smart</span><span style="font-weight:900;font-size:36px;color:#FFD642;letter-spacing:-0.03em;">Worker</span></div>

    <div style="width:100px;height:100px;border-radius:50%;background:rgba(255,214,66,0.1);border:2px solid rgba(255,214,66,0.3);display:flex;align-items:center;justify-content:center;font-size:52px;margin:24px auto;">⏰</div>

    <div style="font-weight:900;font-size:72px;color:#FFD642;letter-spacing:-0.04em;line-height:1;text-transform:uppercase;">Осталось</div>
    <div style="font-weight:900;font-size:120px;color:#fff;letter-spacing:-0.05em;line-height:0.9;margin:10px 0;">7 мест</div>
    <div style="font-size:32px;font-weight:700;color:#8893A8;">в текущем потоке обучения</div>

    <div style="width:80px;height:3px;background:linear-gradient(90deg,transparent,#FFD642,transparent);margin:28px auto;"></div>

    <p style="font-size:26px;color:#c0c8d8;line-height:1.55;max-width:650px;">Следующий набор — через <strong style="color:#fff;">2 месяца</strong>.<br>Успей занять место прямо сейчас.</p>

    <div style="display:flex;gap:16px;margin-top:32px;">
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;width:110px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="font-weight:900;font-size:46px;color:#FFD642;line-height:1;">02</div><div style="font-size:14px;color:#8893A8;margin-top:4px;text-transform:uppercase;letter-spacing:0.1em;">дня</div></div>
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;width:110px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="font-weight:900;font-size:46px;color:#FFD642;line-height:1;">14</div><div style="font-size:14px;color:#8893A8;margin-top:4px;text-transform:uppercase;letter-spacing:0.1em;">часов</div></div>
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;width:110px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="font-weight:900;font-size:46px;color:#FFD642;line-height:1;">37</div><div style="font-size:14px;color:#8893A8;margin-top:4px;text-transform:uppercase;letter-spacing:0.1em;">минут</div></div>
    </div>

    <div style="margin-top:32px;background:#FFD642;color:#0A0F1C;font-weight:800;font-size:24px;padding:22px 52px;border-radius:14px;box-shadow:0 0 60px rgba(255,214,66,0.25);">Забронировать место →</div>
  </div>
</div>
</body>
</html>
